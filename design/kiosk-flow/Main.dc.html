<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #ffe3e3; } a:hover { color: #fff; }
    .brand-dots {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      letter-spacing: .07em;
      background-image: radial-gradient(circle, #1a1210 42%, transparent 45%);
      background-size: 7px 7px;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
    }
    .pulse-dot { animation: pulseGlow 1.8s ease-in-out infinite; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(120,255,170,.55); }
      50% { box-shadow: 0 0 0 14px rgba(120,255,170,0); }
    }
    .scan-wave { animation: waveOut 2.4s ease-out infinite; }
    .scan-wave.d2 { animation-delay: .8s; }
    .scan-wave.d3 { animation-delay: 1.6s; }
    @keyframes waveOut {
      0% { opacity: .55; transform: scale(.7); }
      100% { opacity: 0; transform: scale(1.35); }
    }
  </style>
</helmet>

<div style="--accent:{{accent}}; --accent-dark: color-mix(in oklab, var(--accent) 55%, black); width:1080px; height:1920px; position:relative; overflow:hidden; background: radial-gradient(120% 90% at 50% -8%, var(--accent) 0%, var(--accent-dark) 62%, #1a0607 100%); font-family:'Space Grotesk', sans-serif; color:#fff; display:flex; flex-direction:column;">

  <!-- top brand bar -->
  <div style="display:flex; align-items:center; justify-content:center; padding:72px 0 0 0;">
    <div class="brand-dots" style="font-size:52px;">Brightlands</div>
  </div>
  <div style="text-align:center; margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:.24em; text-transform:uppercase; color:rgba(255,255,255,.65);">Toegangscontrole</div>

  <!-- hero icon -->
  <div style="flex:0 0 auto; display:flex; align-items:center; justify-content:center; margin-top:96px; position:relative; height:280px;">
    <div class="scan-wave" style="position:absolute; width:220px; height:220px; border-radius:50%; border:2px solid rgba(255,255,255,.5);"></div>
    <div class="scan-wave d2" style="position:absolute; width:220px; height:220px; border-radius:50%; border:2px solid rgba(255,255,255,.5);"></div>
    <div class="scan-wave d3" style="position:absolute; width:220px; height:220px; border-radius:50%; border:2px solid rgba(255,255,255,.5);"></div>
    <svg width="132" height="132" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="position:relative;">
      <path d="M3 12l1.8-5.2A2 2 0 0 1 6.7 5.5h10.6a2 2 0 0 1 1.9 1.3L21 12"/>
      <path d="M3 12v5a1 1 0 0 0 1 1h1.2a1 1 0 0 0 1-.86L6.4 15"/>
      <path d="M21 12v5a1 1 0 0 1-1 1h-1.2a1 1 0 0 1-1-.86L17.6 15"/>
      <path d="M3 12h18"/>
      <path d="M6.4 15h11.2"/>
      <circle cx="7.5" cy="15" r=".6" fill="#ffffff"/>
      <circle cx="16.5" cy="15" r=".6" fill="#ffffff"/>
    </svg>
  </div>

  <!-- headline -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:64px 90px 0 90px; text-align:center;">
    <div style="font-size:88px; font-weight:700; line-height:1.04; letter-spacing:-.01em; text-wrap:pretty;">Rij een stukje<br>naar voren</div>
    <div style="margin-top:28px; font-size:32px; line-height:1.4; color:rgba(255,255,255,.82); max-width:760px; text-wrap:pretty;">We herkennen uw kenteken automatisch zodra u dichterbij komt.</div>

    <!-- camera-active strip -->
    <div style="margin-top:88px; width:100%; max-width:780px; border:2px dashed rgba(255,255,255,.4); border-radius:28px; padding:36px 40px; display:flex; align-items:center; gap:28px; background:rgba(0,0,0,.12);">
      <div style="position:relative; width:22px; height:22px; flex:0 0 auto;">
        <div class="pulse-dot" style="width:22px; height:22px; border-radius:50%; background:#7CFFAA;"></div>
      </div>
      <div style="text-align:left;">
        <div style="font-size:28px; font-weight:600;">Scanner actief</div>
        <div style="font-size:22px; color:rgba(255,255,255,.7); margin-top:4px;">Kenteken wordt zo automatisch herkend</div>
      </div>
    </div>
  </div>

  <!-- footer -->
  <div style="padding:0 0 56px 0; display:flex; flex-direction:column; align-items:center; gap:10px;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.12em; color:rgba(255,255,255,.5);">POWERED BY 247ACCESS</div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8203c","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#c8203c'
    };
  }
}
</script>
</body>
</html>
