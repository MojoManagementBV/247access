<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #ffe3e3; } a:hover { color: #fff; }
    .brand-dots {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      letter-spacing: .07em;
      background-image: radial-gradient(circle, #1a1210 42%, transparent 45%);
      background-size: 6px 6px;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
    }
    .check-ring { animation: ringIn .6s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes ringIn { 0% { transform: scale(.5); opacity:0; } 100% { transform: scale(1); opacity:1; } }
    .check-mark { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s ease-out .35s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .barrier-arm { transform-origin: 40px 150px; animation: raise 1s cubic-bezier(.4,0,.2,1) .5s both; }
    @keyframes raise { from { transform: rotate(0deg); } to { transform: rotate(-78deg); } }
  </style>
</helmet>

<div style="--accent:{{accent}}; --accent-dark: color-mix(in oklab, var(--accent) 55%, black); width:1080px; height:1920px; position:relative; overflow:hidden; background: radial-gradient(120% 90% at 50% -8%, var(--accent) 0%, var(--accent-dark) 62%, #1a0607 100%); font-family:'Space Grotesk', sans-serif; color:#fff; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:center; padding:64px 0 0 0;">
    <div class="brand-dots" style="font-size:38px;">Brightlands</div>
  </div>

  <!-- check badge -->
  <div style="display:flex; align-items:center; justify-content:center; margin-top:88px;">
    <div class="check-ring" style="width:220px; height:220px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #6BFF9E, #22B458); display:flex; align-items:center; justify-content:center; box-shadow:0 30px 60px rgba(34,180,88,.45);">
      <svg width="108" height="108" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path class="check-mark" d="M20 6L9 17l-5-5"/>
      </svg>
    </div>
  </div>

  <div style="text-align:center; margin-top:56px; padding:0 90px;">
    <div style="font-size:96px; font-weight:700; letter-spacing:-.01em;">Welkom, Mike</div>
    <div style="margin-top:22px; font-size:32px; color:rgba(255,255,255,.85);">Toegang verleend — de slagboom gaat nu open</div>
  </div>

  <!-- plate confirm chip -->
  <div style="display:flex; justify-content:center; margin-top:44px;">
    <div style="display:flex; align-items:center; gap:16px; background:rgba(0,0,0,.2); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:14px 30px;">
      <div style="width:44px; height:32px; border-radius:5px; background:#F6C700; display:flex; align-items:center; justify-content:center;">
        <div style="font-family:'JetBrains Mono',monospace; font-weight:800; font-size:13px; color:#111;">NL</div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace; font-weight:700; font-size:28px;">XX-999-X</div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7CFFAA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
  </div>

  <!-- barrier illustration -->
  <div style="flex:1; display:flex; align-items:center; justify-content:center; margin-top:20px;">
    <svg width="520" height="360" viewBox="0 0 520 360">
      <!-- ground -->
      <line x1="30" y1="330" x2="490" y2="330" stroke="rgba(255,255,255,.25)" stroke-width="3"/>
      <!-- posts -->
      <rect x="20" y="150" width="40" height="180" rx="8" fill="rgba(255,255,255,.14)" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
      <rect x="440" y="220" width="30" height="110" rx="6" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
      <!-- arm group, pivots open -->
      <g class="barrier-arm">
        <rect x="40" y="140" width="330" height="20" rx="10" fill="#fff"/>
        <rect x="40" y="140" width="42" height="20" fill="#c8203c"/>
        <rect x="118" y="140" width="42" height="20" fill="#c8203c"/>
        <rect x="196" y="140" width="42" height="20" fill="#c8203c"/>
        <rect x="274" y="140" width="42" height="20" fill="#c8203c"/>
        <circle cx="40" cy="150" r="14" fill="#e7e7e7" stroke="rgba(0,0,0,.15)"/>
      </g>
      <text x="180" y="358" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="2" fill="rgba(255,255,255,.55)">POORT OPEN</text>
    </svg>
  </div>

  <div style="padding:0 0 56px 0; display:flex; justify-content:center;">
    <div style="font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.12em; color:rgba(255,255,255,.5);">POWERED BY 247ACCESS</div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8203c","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#c8203c'
    };
  }
}
</script>
</body>
</html>
