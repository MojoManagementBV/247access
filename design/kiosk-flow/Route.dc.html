<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #ffe3e3; } a:hover { color: #fff; }
    .brand-dots {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      letter-spacing: .07em;
      background-image: radial-gradient(circle, #1a1210 42%, transparent 45%);
      background-size: 6px 6px;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      display: inline-block;
    }
    .route-dash { stroke-dasharray: 14 10; animation: dashMove 1.6s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -48; } }
    .ring { animation: spin 6s linear infinite; transform-origin: 50% 50%; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</helmet>

<div style="--accent:{{accent}}; --accent-dark: color-mix(in oklab, var(--accent) 55%, black); width:1080px; height:1920px; position:relative; overflow:hidden; background: radial-gradient(120% 90% at 50% -8%, var(--accent) 0%, var(--accent-dark) 62%, #1a0607 100%); font-family:'Space Grotesk', sans-serif; color:#fff; display:flex; flex-direction:column;">

  <div style="display:flex; align-items:center; justify-content:center; padding:56px 0 0 0;">
    <div class="brand-dots" style="font-size:34px;">Brightlands</div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-top:24px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7CFFAA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    <div style="font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:.18em; color:rgba(255,255,255,.65);">TOEGANG VERLEEND</div>
  </div>

  <div style="text-align:center; margin-top:36px; padding:0 90px;">
    <div style="font-size:66px; font-weight:700; line-height:1.06; text-wrap:pretty;">Volg de route<br>naar uw plek</div>
  </div>

  <!-- map panel -->
  <div style="margin:56px 72px 0 72px; height:880px; border-radius:36px; background:#221a19; position:relative; overflow:hidden; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08), 0 30px 60px rgba(0,0,0,.35);">
    <svg width="936" height="880" viewBox="0 0 936 880" style="position:absolute; inset:0;">
      <!-- entry road, bottom center -->
      <line x1="300" y1="880" x2="300" y2="640" stroke="rgba(255,255,255,.22)" stroke-width="34"/>
      <line x1="300" y1="880" x2="300" y2="640" class="route-dash" stroke="#7CFFAA" stroke-width="4"/>

      <!-- main route curving right to parking -->
      <path d="M300 640 C300 520, 380 460, 520 460 S 700 470, 700 360" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="30" stroke-linecap="round"/>
      <path d="M300 640 C300 520, 380 460, 520 460 S 700 470, 700 360" fill="none" stroke="#7CFFAA" stroke-width="4" class="route-dash" stroke-linecap="round"/>

      <!-- branch to entrance B -->
      <path d="M520 460 C420 460, 340 420, 300 320" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="18" stroke-linecap="round"/>
      <path d="M520 460 C420 460, 340 420, 300 320" fill="none" stroke="rgba(124,255,170,.55)" stroke-width="3" stroke-dasharray="4 10" stroke-linecap="round"/>

      <!-- kiosk / gate marker -->
      <g>
        <circle cx="300" cy="700" r="30" fill="#fff"/>
        <rect x="288" y="686" width="24" height="28" rx="3" fill="#c8203c"/>
      </g>

      <!-- parking marker -->
      <g>
        <circle cx="700" cy="330" r="46" fill="#fff"/>
        <text x="700" y="348" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="46" fill="#c8203c" text-anchor="middle">P</text>
      </g>

      <!-- entrance B marker -->
      <g>
        <circle cx="280" cy="280" r="40" fill="#fff"/>
        <text x="280" y="296" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="36" fill="#c8203c" text-anchor="middle">B</text>
      </g>

      <!-- arrow head at parking -->
      <path d="M700 360 l-14 -22 l28 0 z" fill="#7CFFAA"/>
    </svg>

    <div style="position:absolute; left:50%; top:78%; transform:translate(-50%,0); font-family:'JetBrains Mono',monospace; font-size:20px; letter-spacing:.1em; color:rgba(255,255,255,.7);">U BENT HIER</div>
    <div style="position:absolute; left:73%; top:33%; transform:translate(-50%,-140%); font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.08em; color:rgba(255,255,255,.75); text-align:center;">PARKEREN</div>
    <div style="position:absolute; left:30%; top:26%; transform:translate(-50%,-150%); font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.08em; color:rgba(255,255,255,.75); text-align:center;">INGANG B</div>
  </div>

  <!-- instruction cards -->
  <div style="display:flex; flex-direction:column; gap:20px; margin:44px 72px 0 72px;">
    <div style="display:flex; align-items:center; gap:26px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.18); border-radius:24px; padding:28px 32px;">
      <div style="width:64px; height:64px; border-radius:16px; background:#7CFFAA; display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:30px; color:#123a22;">P</span>
      </div>
      <div style="font-size:30px; font-weight:600; text-wrap:pretty;">Parkeer na 200 meter rechts</div>
    </div>
    <div style="display:flex; align-items:center; gap:26px; background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.18); border-radius:24px; padding:28px 32px;">
      <div style="width:64px; height:64px; border-radius:16px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; flex:0 0 auto;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><circle cx="15" cy="12" r=".8" fill="#fff"/></svg>
      </div>
      <div style="font-size:30px; font-weight:600; text-wrap:pretty;">U wordt verwacht bij ingang B</div>
    </div>
  </div>

  <div style="flex:1;"></div>
  <div style="padding:0 0 56px 0; display:flex; align-items:center; justify-content:center; gap:14px;">
    <svg class="ring" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.4"><circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="14"/></svg>
    <div style="font-family:'JetBrains Mono',monospace; font-size:18px; letter-spacing:.1em; color:rgba(255,255,255,.5);">SCHERM SLUIT AUTOMATISCH</div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#c8203c","section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#c8203c'
    };
  }
}
</script>
</body>
</html>
